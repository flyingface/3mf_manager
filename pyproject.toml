[project]
name = "3mf-manager"
version = "2.0.0"
description = "Local 3MF file manager for 3D printing — parse, classify, rename, search and organize your MakerWorld 3MF files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "3MF Manager Contributors" }]
keywords = ["3mf", "3d-printing", "makerworld", "file-manager", "bambulab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Utilities",
]

[project.scripts]
mfmanager = "runner:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["server", "llm_client", "parse_3mf", "subcat", "mc_subcat", "runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
